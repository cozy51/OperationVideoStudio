[package]
name = "operation-video-studio"
version = "0.1.2"
description = "Local Windows recording and non-destructive video editor"
authors = ["Operation Video Studio contributors"]
edition = "2021"

[lib]
name = "ovs"

[[bin]]
name = "operation-video-studio"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd", "dep:windows-sys", "dep:wasapi", "dep:hound", "dep:windows"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
base64 = "0.22"
png = "0.17"
tauri = { version = "2", optional = true, features = ["protocol-asset"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = ["Win32_Media_Audio"] }
wasapi = { version = "0.26", optional = true }
hound = { version = "3.5", optional = true }
rfd = { version = "0.15", optional = true }
windows-sys = { version = "0.59", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Performance"] }

[build-dependencies]
tauri-build = { version = "2", optional = true }
